[project]
name = "amythest"
version = "0.1.0"
description = "Amythest: a modular scalable model architecture with dynamic knowledge modules"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Amythest Contributors"},
]
keywords = ["llm", "modular", "modules", "knowledge", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "click>=8.1.0",
  "rich>=13.0.0",
  "pydantic>=2.0.0",
  "sqlalchemy>=2.0.0",
  "faiss-cpu>=1.7.0",
  "sentence-transformers>=2.0.0",
  "httpx>=0.25.0",
  "safetensors>=0.4.0",
  "torch>=2.0.0",
  "peft>=0.7.0",
  "transformers>=4.40.0",
  "textual>=0.44.0",
  "watchdog>=3.0.0",
  "pyyaml>=6.0",
  "requests>=2.31.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-asyncio>=0.21.0",
  "ruff>=0.1.0",
  "mypy>=1.7.0",
]
dvc = [
  "dvc>=3.0.0",
]

[project.scripts]
amythest = "amythest.cli.main:main"

[project.urls]
Homepage = "https://github.com/LoopyLuci/Amythest"
Documentation = "https://amythest.ai/docs"
Repository = "https://github.com/LoopyLuci/Amythest"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
ignore_missing_imports = true
